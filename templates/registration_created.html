<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Created — Obsidia'27</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;
            color: #f1f1f1;

            font-family: Arial, sans-serif;
        }

        .card {
            width: min(90%, 500px);

            padding: 45px 30px;

            text-align: center;

            border: 1px solid #333;

            background: #111;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.7);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 35px;
        }

        .details {
            text-align: left;

            padding: 20px;

            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        .row {
            display: flex;
            justify-content: space-between;

            padding: 10px 0;

            color: #ccc;
        }

        .value {
            color: white;
            font-weight: bold;
        }

        .status {
            margin-top: 30px;

            padding: 12px;

            border: 1px solid #555;

            color: #ccc;

            letter-spacing: 2px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Registration Created</h1>

        <p class="subtitle">
            Obsidia'27
        </p>

        <div class="details">

            <div class="row">
                <span>Registration ID</span>
                <span class="value">
                    #{{ registration["id"] }}
                </span>
            </div>

            <div class="row">
                <span>Name</span>
                <span class="value">
                    {{ registration["name"] }}
                </span>
            </div>

            <div class="row">
                <span>Class</span>
                <span class="value">
                    {{ registration["class_name"] }}
                </span>
            </div>

            <div class="row">
                <span>Amount</span>
                <span class="value">
                    ₹{{ registration["amount"] }}
                </span>
            </div>

        </div>

        <div class="status">
            PAYMENT STATUS: {{ registration["payment_status"] }}
        </div>

    </div>

</body>
</html>
